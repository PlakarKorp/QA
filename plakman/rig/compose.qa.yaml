# QA override: moves published host ports out of the way. Nothing here changes
# plakman itself. The parent is core-api, stood up from its own compose; see
# compose.core-api.yaml.
#
# The ports are variables so a rig can run beside another stack on the same
# machine: qa.sh exports them from DB_PORT and GARAGE_PORT.
services:
  plakman:
    depends_on:
      - db
    ports: !override
      - "18080:8080"

  db:
    ports: !override
      - "${QA_DB_PORT:-15432}:5432"

  # The S3 server plakman's compose ships. Only the S3 API and the admin API
  # are published: the rpc and web ports are the container's own business.
  garage:
    ports: !override
      - "${QA_GARAGE_PORT:-3900}:3900"
      - "${QA_GARAGE_ADMIN_PORT:-3903}:3903"

  # The orkestrator the daemon proxies release-feed, update and network calls
  # to. compose builds it from plakman's cmd/mock-orkestrator; we bind-mount a
  # static build instead so the rig needs no image build. It hardcodes :8080
  # internally, hence the published port.
  orkestrator:
    image: debian:trixie-slim
    pull_policy: missing
    # Drop the builder dependency: compose builds plk-orkestrator:local with
    # `RUN --mount=type=ssh`, which needs BuildKit and a key. We bind-mount a
    # static build of the same cmd instead.
    depends_on: !reset []
    build: !reset null
    command: ["/usr/local/bin/mock-orkestrator"]
    volumes:
      - ${QA_MOCK_ORKESTRATOR:?set QA_MOCK_ORKESTRATOR to the mock-orkestrator binary}:/usr/local/bin/mock-orkestrator:ro
    ports:
      - "18083:8080"
