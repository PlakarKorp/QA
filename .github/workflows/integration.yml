# Reusable QA workflow for plakar integrations. Call it from the integration's
# repository:
#
#   jobs:
#     qa:
#       uses: PlakarKorp/QA/.github/workflows/integration.yml@<ref>
#       with: { dir: s3, qa-version-file: s3/.qa-version }
#
# The QA version pins the lint rules and tool versions in integrations/, apart
# from `uses:`: bumping it can break the build, so do it on purpose.
#
# An integration that depends on private Go modules names them in go-private.
# The job token can only read the calling repository; for modules elsewhere,
# pass a token that can read them:
#
#       with: { dir: msad, qa-version-file: msad/.qa-version,
#               go-private: github.com/PlakarKorp/integrations-private }
#       secrets: { go-private-token: ${{ secrets.PRIVATE_MODULES_TOKEN }} }
name: integration

on:
  workflow_call:
    inputs:
      dir:
        description: directory holding the integration's go.mod and manifest.yaml
        type: string
        required: true
      qa-version-file:
        description: file holding the version of PlakarKorp/QA to take the lint rules and tools from, relative to the repository root; main if unset
        type: string
        default: ''
      go-private:
        description: GOPRIVATE patterns of the private Go modules the integration depends on; none if unset
        type: string
        default: ''
    secrets:
      go-private-token:
        description: token that can read the go-private modules; the job token if unset, which only reads the calling repository
        required: false

jobs:
  versions:
    name: versions
    runs-on: ubuntu-latest
    outputs:
      qa: ${{ steps.qa.outputs.version }}
      golangci-lint: ${{ steps.tools.outputs.golangci-lint }}
      validator: ${{ steps.tools.outputs.validator }}
      govulncheck: ${{ steps.tools.outputs.govulncheck }}
    steps:
      - name: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: resolve the QA version
        id: qa
        env:
          QA_VERSION_FILE: ${{ inputs.qa-version-file }}
        run: |
          QA_VERSION=main
          if [ -n "$QA_VERSION_FILE" ]; then
            QA_VERSION=$(tr -d '[:space:]' < "$QA_VERSION_FILE")
          fi
          echo "version=$QA_VERSION" >> "$GITHUB_OUTPUT"

      - name: checkout the QA tool versions
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: PlakarKorp/QA
          ref: ${{ steps.qa.outputs.version }}
          path: .qa
          sparse-checkout: integrations/versions
          sparse-checkout-cone-mode: false

      # The file is already in key=value form.
      - name: read the QA tool versions
        id: tools
        run: cat .qa/integrations/versions >> "$GITHUB_OUTPUT"

  validate:
    name: validate
    needs: versions
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ inputs.dir }}
    steps:
      - name: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: ${{ inputs.dir }}/go.mod
          cache-dependency-path: ${{ inputs.dir }}/go.sum

      - name: cache the validator
        id: validator-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/go/bin/validator
          key: validator-${{ runner.os }}-${{ needs.versions.outputs.validator }}

      # The validator may need a newer Go than the integration pins; setup-go
      # sets GOTOOLCHAIN=local, so let go fetch the toolchain it asks for.
      - name: install the validator
        if: steps.validator-cache.outputs.cache-hit != 'true'
        env:
          GOTOOLCHAIN: auto
        run: go install github.com/PlakarKorp/pkg/cmd/validator@${{ needs.versions.outputs.validator }}

      - name: validate the integration
        run: validator -v repo .

  lint:
    name: lint
    needs: versions
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: ${{ inputs.dir }}/go.mod
          cache-dependency-path: ${{ inputs.dir }}/go.sum

      - name: checkout the shared lint config
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: PlakarKorp/QA
          ref: ${{ needs.versions.outputs.qa }}
          path: .qa
          sparse-checkout: integrations/golangci.yml
          sparse-checkout-cone-mode: false

      # After the checkouts: the rewrite applies to every github.com URL.
      - name: set up private modules
        if: inputs.go-private != ''
        env:
          GO_PRIVATE: ${{ inputs.go-private }}
          TOKEN: ${{ secrets.go-private-token || github.token }}
        run: |
          git config --global url."https://x-access-token:${TOKEN}@github.com/".insteadOf "https://github.com/"
          echo "GOPRIVATE=$GO_PRIVATE" >> "$GITHUB_ENV"

      - name: golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: ${{ needs.versions.outputs.golangci-lint }}
          working-directory: ${{ inputs.dir }}
          args: --config ${{ github.workspace }}/.qa/integrations/golangci.yml

  vulncheck:
    name: vulncheck
    needs: versions
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ inputs.dir }}
    steps:
      - name: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: ${{ inputs.dir }}/go.mod
          cache-dependency-path: ${{ inputs.dir }}/go.sum

      - name: set up private modules
        if: inputs.go-private != ''
        env:
          GO_PRIVATE: ${{ inputs.go-private }}
          TOKEN: ${{ secrets.go-private-token || github.token }}
        run: |
          git config --global url."https://x-access-token:${TOKEN}@github.com/".insteadOf "https://github.com/"
          echo "GOPRIVATE=$GO_PRIVATE" >> "$GITHUB_ENV"

      # Built with the integration's Go: govulncheck reports the standard
      # library vulnerabilities of the toolchain it was built with.
      - name: install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@${{ needs.versions.outputs.govulncheck }}

      - name: govulncheck
        run: govulncheck ./...

  test:
    name: test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ inputs.dir }}
    steps:
      - name: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: ${{ inputs.dir }}/go.mod
          cache-dependency-path: ${{ inputs.dir }}/go.sum

      - name: set up private modules
        if: inputs.go-private != ''
        env:
          GO_PRIVATE: ${{ inputs.go-private }}
          TOKEN: ${{ secrets.go-private-token || github.token }}
        run: |
          git config --global url."https://x-access-token:${TOKEN}@github.com/".insteadOf "https://github.com/"
          echo "GOPRIVATE=$GO_PRIVATE" >> "$GITHUB_ENV"

      - name: test
        run: go test -race ./...
